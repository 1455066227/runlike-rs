[package]
name = "runlike"
version = "1.6.3"
edition = "2021"
rust-version = "1.74"
description = "Reverse-engineer a docker run command line from a running container"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["docker", "cli", "containers"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true